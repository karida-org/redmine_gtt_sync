name: Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub Actions SHA-pinning gate, via the geolonia/.github reusable. It reads
  # this repo's .pinact.yml (7-day min_age, own-org exemptions).
  action-pinning:
    permissions:
      contents: read
    uses: geolonia/.github/.github/workflows/reusable-pinact-check.yml@6793909a4c6f49d80a7a568750ecd8a6aac64972 # v1.34.0

  # GitHub Actions static analysis (dangerous triggers, template injection,
  # excessive permissions, credential persistence).
  zizmor:
    name: zizmor (GitHub Actions audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          # SARIF upload needs GitHub Advanced Security (not on private repos
          # without a license); use workflow annotations instead so behavior is
          # identical on public and private repos.
          advanced-security: false
          annotations: true
          version: "1.26.1"
