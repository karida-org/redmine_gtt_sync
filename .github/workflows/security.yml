name: Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub Actions SHA-pinning gate, via the geolonia/.github reusable. It reads
  # this repo's .pinact.yml (7-day min_age, own-org exemptions).
  action-pinning:
    permissions:
      contents: read
    uses: geolonia/.github/.github/workflows/reusable-pinact-check.yml@82fb51be9f5a20f4e75762bb0cabcfab9ff20a21 # v1.36.0

  # GitHub Actions static analysis (dangerous triggers, template injection,
  # excessive permissions, credential persistence).
  zizmor:
    name: zizmor (GitHub Actions audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # SARIF upload needs GitHub Advanced Security (not on private repos
          # without a license); use workflow annotations instead so behavior is
          # identical on public and private repos.
          advanced-security: false
          annotations: true
          version: "1.26.1"
