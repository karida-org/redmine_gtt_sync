en:
  text_gtt_sync_oauth_intro: "This page turns on the connection between this site and QGIS, the desktop mapping app. Once it is set up, your team can open this site's issues as an editable map in QGIS using the QTask plugin, signing in with their normal account. Nobody has to copy any keys, passwords, or web addresses by hand."
  text_gtt_sync_textile_warning: "This site is not set to a Markdown text format. QGIS/QTask formats issue descriptions and notes as Markdown, so it turns off its Markdown editor and preview and shows the text as-is. For the best experience, set the text formatting to \"CommonMark Markdown (GitHub Flavored)\" under Administration > Settings > General."
  label_gtt_sync_oauth_status: "Status"
  text_gtt_sync_oauth_status_ready: "On. People can connect from QGIS/QTask and sign in with their own account."
  text_gtt_sync_oauth_status_off: "Off. Nobody can connect from QGIS/QTask yet. Use the button below to set it up."
  label_gtt_sync_oauth_application: "QGIS / QTask connection"
  label_gtt_sync_oauth_application_none: "Not set up (nobody can connect yet)"
  text_gtt_sync_oauth_application_hint: "Choose how QGIS/QTask users sign in, or leave it \"Not set up\" to keep the connection off. Only safe connections are listed, and no password or secret is ever shared with QGIS."
  text_gtt_sync_oauth_no_public_apps: "Nothing to connect through yet. Use the button below to set up the connection in one click."
  button_gtt_sync_create_oauth_application: "Set up the QGIS / QTask connection"
  text_gtt_sync_create_oauth_application_hint: "Sets up the connection for you and turns it on. Safe to click again later: it just re-checks the settings and fixes anything that has drifted."
  notice_gtt_sync_oauth_application_created: "The QGIS/QTask connection is set up and turned on."
  error_gtt_sync_oauth_application_failed: "Could not set up the connection: %{message}"
  label_gtt_sync_oauth_scope_status: "What QGIS users can do"
  text_gtt_sync_oauth_scopes_granted: "This connection allows %{count} of %{total} QTask actions. QTask uses exactly these, so removing permissions from the connection simply hides the matching features in QGIS."
  text_gtt_sync_oauth_scopes_ungranted: "Turned off for now (these stay unavailable in QGIS until the permission is added back): %{scopes}"
  label_gtt_sync_oauth_section_desktop: "QGIS desktop (QTask)"
  label_gtt_sync_oauth_section_mobile: "Georeport mobile app"
  text_gtt_sync_mobile_oauth_intro: "The Georeport mobile app connects the same way: people sign in with their normal account from their phone, and nothing has to be copied by hand. Setting it up here lets the app configure itself from just this site's address."
  label_gtt_sync_mobile_oauth_status: "Status"
  text_gtt_sync_mobile_oauth_status_ready: "On. People can connect from the Georeport mobile app and sign in with their own account."
  text_gtt_sync_mobile_oauth_status_off: "Off. Nobody can sign in from the Georeport mobile app yet. Use the button below to set it up."
  label_gtt_sync_mobile_oauth_application: "Mobile app connection"
  text_gtt_sync_mobile_oauth_application_hint: "Choose how mobile app users sign in, or leave it \"Not set up\" to keep the connection off. Only safe connections are listed, and no password or secret is ever shared with the app."
  button_gtt_sync_create_mobile_oauth_application: "Set up the mobile app connection"
  text_gtt_sync_create_mobile_oauth_application_hint: "Sets up the mobile connection for you and turns it on. Safe to click again later: it just re-checks the settings and fixes anything that has drifted."
  notice_gtt_sync_mobile_oauth_application_created: "The mobile app connection is set up and turned on."
  label_gtt_sync_mobile_oauth_scope_status: "What mobile users can do"
  text_gtt_sync_mobile_oauth_scopes_granted: "This connection allows %{count} of %{total} app actions. The app uses exactly these, so removing permissions from the connection simply hides the matching features on the phone."
  text_gtt_sync_mobile_oauth_scopes_ungranted: "Turned off for now (these stay unavailable in the app until the permission is added back): %{scopes}"
  label_gtt_sync_connect_menu: "Connect"
  label_gtt_sync_connect: "Connect QGIS"
  text_gtt_sync_connect_intro: "Use these details to connect this instance from the QTask plugin for QGIS."
  label_gtt_sync_connect_url: "Instance URL"
  label_gtt_sync_connect_client_id: "OAuth Client ID"
  label_gtt_sync_connect_scopes: "Scopes"
  button_gtt_sync_copy: "Copy"
  label_gtt_sync_copied: "Copied"
  button_gtt_sync_download_qgis_config: "Download QGIS OAuth2 config"
  text_gtt_sync_connect_no_client_id: "This instance hasn't published an OAuth Client ID yet. Ask an administrator to select or create the QTask OAuth application in the plugin settings."
  text_gtt_sync_connect_no_client_id_admin: "This instance hasn't published an OAuth Client ID yet. Select or create the QTask OAuth application in the plugin settings so QGIS/QTask users can connect; the connection details appear here once one is published."
  button_gtt_sync_configure_oauth_application: "Configure the QTask OAuth application"
  text_gtt_sync_connect_instructions: "In QGIS: install QTask, add a connection with this Instance URL and OAuth2 authentication, then click Create OAuth2 config (the Client ID and scopes are filled in automatically). Authorize the connection in your browser on first use."
