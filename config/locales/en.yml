en:
  label_gtt_sync_oauth_application: "QTask OAuth application"
  label_gtt_sync_oauth_application_none: "(advertise scopes only, no client ID)"
  text_gtt_sync_oauth_application_hint: "Public (PKCE) OAuth application whose client ID is advertised to QGIS/QTask clients on the capabilities probe, so users don't have to look it up. Only non-confidential applications are listed; a client secret is never advertised."
  text_gtt_sync_oauth_no_public_apps: "No public OAuth applications found. Register a non-confidential OAuth application (Authorization Code + PKCE, no client secret) under Administration to advertise it here, or use the button below."
  button_gtt_sync_create_oauth_application: "Create QTask OAuth application"
  text_gtt_sync_create_oauth_application_hint: "Creates a public PKCE application (loopback redirect, QTask scopes) and selects it above. Re-running reconciles its redirect and scopes."
  notice_gtt_sync_oauth_application_created: "OAuth application \"%{name}\" is ready and selected for QGIS/QTask."
  error_gtt_sync_oauth_application_failed: "Could not create the OAuth application: %{message}"
  label_gtt_sync_oauth_scope_status: "QTask scopes granted"
  text_gtt_sync_oauth_scopes_granted: "%{count} of %{total} QTask scopes are granted by this application. QTask requests exactly these, so narrowing the application's scopes simply hides the matching features."
  text_gtt_sync_oauth_scopes_ungranted: "Not granted (these features stay unavailable until the scope is added): %{scopes}"
  label_gtt_sync_connect_menu: "Connect"
  label_gtt_sync_connect: "Connect QGIS"
  text_gtt_sync_connect_intro: "Use these details to connect this instance from the QTask plugin for QGIS."
  label_gtt_sync_connect_url: "Instance URL"
  label_gtt_sync_connect_client_id: "OAuth Client ID"
  label_gtt_sync_connect_scopes: "Scopes"
  button_gtt_sync_copy: "Copy"
  label_gtt_sync_copied: "Copied"
  button_gtt_sync_download_qgis_config: "Download QGIS OAuth2 config"
  text_gtt_sync_connect_no_client_id: "This instance hasn't published an OAuth Client ID yet. Ask an administrator to select or create the QTask OAuth application in the plugin settings."
  text_gtt_sync_connect_instructions: "In QGIS: install QTask, add a connection with this Instance URL and OAuth2 authentication, then click Create OAuth2 config (the Client ID and scopes are filled in automatically). Authorize the connection in your browser on first use."
