ja:
  text_gtt_sync_oauth_intro: "このページでは、このサイトとデスクトップ地図アプリ「QGIS」との接続を有効にします。設定が済むと、チームのメンバーは QTask プラグインを使って、このサイトのチケットを編集できる地図として QGIS で開けます。サインインは各自の通常アカウントで行います。キーやパスワード、アドレスを手作業でコピーする必要はありません。"
  text_gtt_sync_textile_warning: "このサイトのテキスト書式は Markdown に設定されていません。QGIS/QTask はチケットの説明や注記を Markdown として扱うため、Markdown エディターとプレビューを無効にし、テキストをそのまま表示します。快適に使うには、「管理 > 設定 > 全般」でテキストの書式を「CommonMark Markdown (GitHub Flavored)」に変更してください。"
  label_gtt_sync_oauth_status: "状態"
  text_gtt_sync_oauth_status_ready: "有効です。QGIS/QTask から各自のアカウントでサインインして接続できます。"
  text_gtt_sync_oauth_status_off: "無効です。まだ誰も QGIS/QTask から接続できません。下のボタンから設定してください。"
  label_gtt_sync_oauth_application: "QGIS / QTask 接続"
  label_gtt_sync_oauth_application_none: "未設定（まだ誰も接続できません）"
  text_gtt_sync_oauth_application_hint: "QGIS/QTask ユーザーのサインイン方法を選びます。「未設定」のままにすると接続は無効のままです。安全な接続だけが一覧に表示され、パスワードや秘密情報が QGIS に渡ることはありません。"
  text_gtt_sync_oauth_no_public_apps: "接続に使えるものがまだありません。下のボタンを押すと、ワンクリックで接続を設定できます。"
  button_gtt_sync_create_oauth_application: "QGIS / QTask 接続を設定する"
  text_gtt_sync_create_oauth_application_hint: "接続を自動で設定して有効にします。あとからもう一度押しても安全です。設定を確認し、ずれがあれば直すだけです。"
  notice_gtt_sync_oauth_application_created: "QGIS/QTask 接続を設定して有効にしました。"
  error_gtt_sync_oauth_application_failed: "接続を設定できませんでした: %{message}"
  label_gtt_sync_oauth_scope_status: "QGIS ユーザーができること"
  text_gtt_sync_oauth_scopes_granted: "この接続では、QTask の操作 %{total} 件のうち %{count} 件が許可されています。QTask はこの許可だけを使うため、接続から権限を外すと、対応する機能が QGIS 上で非表示になります。"
  text_gtt_sync_oauth_scopes_ungranted: "現在オフのもの（権限を戻すまで QGIS では使えません）: %{scopes}"
  text_gtt_sync_oauth_redirect_mismatch: "この接続にはデスクトップ用の戻り先アドレス（http://127.0.0.1...）がないため、QGIS からのサインインは失敗する可能性があります。下の設定ボタンで管理対象の接続を修復できます。"
  text_gtt_sync_mobile_oauth_redirect_mismatch: "この接続にはモバイルアプリが使える戻り先アドレス（georeport:// または https のアプリリンク）がないため、アプリからのサインインは失敗する可能性があります。下の設定ボタンで管理対象の接続を修復できます。"
  label_gtt_sync_oauth_section_desktop: "QGIS デスクトップ（QTask）"
  label_gtt_sync_oauth_section_mobile: "Georeport モバイルアプリ"
  text_gtt_sync_mobile_oauth_intro: "Georeport モバイルアプリも同じ仕組みで接続します。スマートフォンから普段のアカウントでサインインでき、手作業でコピーするものはありません。ここで設定しておくと、アプリはこのサイトのアドレスを入力するだけで自動的に設定されます。"
  label_gtt_sync_mobile_oauth_status: "状態"
  text_gtt_sync_mobile_oauth_status_ready: "オン。Georeport モバイルアプリから自分のアカウントでサインインして接続できます。"
  text_gtt_sync_mobile_oauth_status_off: "オフ。まだ Georeport モバイルアプリからはサインインできません。下のボタンで設定してください。"
  label_gtt_sync_mobile_oauth_application: "モバイルアプリ接続"
  text_gtt_sync_mobile_oauth_application_hint: "モバイルアプリのユーザーがどの接続でサインインするかを選ぶか、「未設定」のままにして接続をオフにしておけます。安全な接続だけが一覧に表示され、パスワードや秘密情報がアプリに渡ることはありません。"
  button_gtt_sync_create_mobile_oauth_application: "モバイルアプリ接続を設定する"
  text_gtt_sync_create_mobile_oauth_application_hint: "モバイル接続を自動で設定してオンにします。あとからもう一度押しても安全です。設定を確認し、ずれがあれば直すだけです。"
  notice_gtt_sync_mobile_oauth_application_created: "モバイルアプリ接続を設定してオンにしました。"
  label_gtt_sync_mobile_oauth_scope_status: "モバイルユーザーができること"
  text_gtt_sync_mobile_oauth_scopes_granted: "この接続では %{total} 個のアプリ操作のうち %{count} 個が許可されています。アプリはこの操作だけを使うため、接続から権限を外すと該当する機能がスマートフォン側で非表示になります。"
  text_gtt_sync_mobile_oauth_scopes_ungranted: "現在オフの操作（権限を戻すまでアプリでは使えません）: %{scopes}"
  label_gtt_sync_connect_menu: "接続"
  label_gtt_sync_connect: "QGIS と接続"
  text_gtt_sync_connect_intro: "QGIS の QTask プラグインからこのインスタンスへ接続するには、次の情報を使います。"
  label_gtt_sync_connect_url: "インスタンス URL"
  label_gtt_sync_connect_client_id: "OAuth クライアント ID"
  label_gtt_sync_connect_scopes: "スコープ"
  button_gtt_sync_copy: "コピー"
  label_gtt_sync_copied: "コピーしました"
  button_gtt_sync_download_qgis_config: "QGIS 用 OAuth2 設定をダウンロード"
  text_gtt_sync_connect_no_client_id: "このインスタンスはまだ OAuth クライアント ID を公開していません。プラグイン設定で QTask 用 OAuth アプリケーションを選択または作成するよう、管理者に依頼してください。"
  text_gtt_sync_connect_no_client_id_admin: "このインスタンスはまだ OAuth クライアント ID を公開していません。QGIS/QTask ユーザーが接続できるよう、プラグイン設定で QTask 用 OAuth アプリケーションを選択または作成してください。公開すると、接続情報がここに表示されます。"
  button_gtt_sync_configure_oauth_application: "QTask 用 OAuth アプリケーションを設定"
  text_gtt_sync_connect_instructions: "QGIS での手順: QTask をインストールし、このインスタンス URL と OAuth2 認証で接続を追加してから、「Create OAuth2 config」をクリックします（クライアント ID とスコープは自動で入力されます）。初回利用時はブラウザーで接続を承認してください。"
